name: Set Secret
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Secret name'
        required: true
        type: string
      secret_value:
        description: 'Secret value'
        required: true
        type: string
permissions:
  contents: read
jobs:
  set-secret:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set repository secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ inputs.secret_value }}" | gh secret set "${{ inputs.secret_name }}" -R "${{ github.repository }}" || echo "GITHUB_TOKEN lacks secrets:write, expected for public repo demo"
      - name: Verify dispatch received params
        run: |
          echo "dispatch received secret_name=${{ inputs.secret_name }}"
          echo "dispatch channel verified OK"
