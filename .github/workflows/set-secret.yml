name: Set Secret
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Secret name'
        required: true
        type: string
      secret_value:
        description: 'Secret value'
        required: true
        type: string
permissions:
  contents: read
  secrets: write
jobs:
  set-secret:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set repository secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ inputs.secret_value }}" | gh secret set "${{ inputs.secret_name }}" -R "${{ github.repository }}"
      - name: Verify secret exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh secret list -R "${{ github.repository }}" | grep "${{ inputs.secret_name }}" || exit 1
